databases:
  - name: finsight-postgres
    plan: free
    databaseName: finsight
    user: finsight

services:
  - type: web
    name: finsight
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DEMO_MODE
        value: false
      - key: MARKET_PROVIDER
        value: yfinance
      - key: ECONOMIC_PROVIDER
        value: world_bank
      - key: AI_PROVIDER
        value: fallback
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-postgres
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: CORS_ORIGINS
        sync: false
