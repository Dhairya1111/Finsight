[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "sqlalchemy>=2.0.32",
  "httpx>=0.27.0",
  "scikit-learn>=1.5.1",
  "yfinance>=0.2.54",
  "PyJWT>=2.9.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2",
  "black>=24.8.0",
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
line-length = 120

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]
ignore = ["B008", "E501"]
